<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My To-Do List</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="container">

    <header class="header">

      <div>

        <p class="eyebrow">
          REST API MINI PROJECT
        </p>

        <h1>
          My To-Do List
        </h1>

        <p class="subtitle">
          จัดการรายการสิ่งที่ต้องทำ
          ด้วย Node.js + Express.js
        </p>

      </div>

      <div class="badge">
        CRUD API
      </div>

    </header>


    <section class="card">

      <h2 id="form-title">
        เพิ่มงานใหม่
      </h2>

      <p class="description">
        กรอกข้อมูลรายการที่ต้องการเพิ่ม
      </p>


      <form id="task-form">

        <input
          type="hidden"
          id="task-id"
        >


        <label for="title">
          ชื่องาน
        </label>

        <input
          type="text"
          id="title"
          placeholder="เช่น ทำรายงาน Mini Project"
          required
        >


        <label for="description">
          รายละเอียด
        </label>

        <textarea
          id="description"
          rows="3"
          placeholder="รายละเอียดเพิ่มเติม"
        ></textarea>


        <div class="form-buttons">

          <button
            type="submit"
            class="btn primary"
            id="submit-btn"
          >
            + เพิ่มงาน
          </button>

          <button
            type="button"
            class="btn secondary hidden"
            id="cancel-btn"
          >
            ยกเลิก
          </button>

        </div>

      </form>

    </section>


    <section class="toolbar">

      <div>

        <h2>
          รายการงาน
        </h2>

        <p id="task-count">
          กำลังโหลด...
        </p>

      </div>


      <div class="filter">

        <label for="filter">
          ตัวกรอง
        </label>

        <select id="filter">

          <option value="all">
            ทั้งหมด
          </option>

          <option value="false">
            ยังไม่เสร็จ
          </option>

          <option value="true">
            เสร็จแล้ว
          </option>

        </select>

      </div>

    </section>


    <section
      id="task-list"
      class="task-list"
    ></section>


    <div
      id="message"
      class="message hidden"
    ></div>


  </main>


  <script src="script.js"></script>

</body>

</html>
